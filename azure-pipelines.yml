# CI de FinanceTracker API (.NET 8) en Azure Pipelines
# Origen: Azure Repos (espejo de GitHub). El despliegue sigue en GitHub Actions.

trigger:
  branches:
    include: [ master ]

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: 'Release'
  solution: 'FinanceTracker.sln'
  apiProject: 'FinanceTracker.Api/FinanceTracker.Api.csproj'

stages:
  - stage: Build
    displayName: Build y tests
    jobs:
      - job: BuildTest
        displayName: Compilar, testear y publicar
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: '8.x'
            displayName: Instalar .NET 8

          - task: DotNetCoreCLI@2
            inputs:
              command: restore
              projects: '$(solution)'
            displayName: Restaurar paquetes

          - task: DotNetCoreCLI@2
            inputs:
              command: build
              projects: '$(solution)'
              arguments: '--configuration $(buildConfiguration) --no-restore'
            displayName: Build

          - task: DotNetCoreCLI@2
            inputs:
              command: test
              projects: '$(solution)'
              arguments: '--configuration $(buildConfiguration) --no-build --collect "XPlat Code Coverage"'
              publishTestResults: true
            displayName: Tests (xUnit)

          - task: PublishCodeCoverageResults@2
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
            displayName: Publicar cobertura

          - task: DotNetCoreCLI@2
            inputs:
              command: publish
              publishWebProjects: false
              projects: '$(apiProject)'
              arguments: '--configuration $(buildConfiguration) --no-build -o $(Build.ArtifactStagingDirectory)/api'
              zipAfterPublish: true
            displayName: Publicar API

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/api'
              artifact: 'api'
            displayName: Subir artefacto

  - stage: Docker
    displayName: Validar imagen Docker
    dependsOn: Build
    jobs:
      - job: DockerBuild
        displayName: Build de la imagen
        steps:
          - script: docker build -t financetracker-api:$(Build.BuildId) .
            displayName: docker build