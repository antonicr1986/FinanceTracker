# Formulario "Bug": todo lo necesario para reproducir y entender el fallo.
name: Bug
description: Algo no funciona como debería.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Describe el fallo en una o dos frases.
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ir a ...
        2. Pulsar ...
        3. Ver el error
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true

  - type: textarea
    id: obtenido
    attributes:
      label: Resultado obtenido
    validations:
      required: true

  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: Versión de la app, navegador, sistema operativo, entorno (dev, pre, pro)...
      placeholder: v1.2.0 · Chrome 130 · Windows 11 · pre

  - type: textarea
    id: logs
    attributes:
      label: Logs o mensajes de error
      description: Se mostrarán como bloque de código. Revisa que no contengan datos sensibles.
      render: shell
