name: Sync to Azure DevOps

on:
  push:
    branches:
      - '**'
      - '!dependabot/**'   # Dependabot no tiene acceso a los secrets de Actions
    tags: ['**']
  workflow_dispatch:

# Permisos minimos: solo leer el codigo. El push a Azure DevOps usa su propio
# PAT (secret AZURE_DEVOPS_PAT), no el GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Push a Azure DevOps
        env:
          PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          REPO: ${{ secrets.AZURE_DEVOPS_REPO }}
        run: |
          if [[ -z "${PAT}" || -z "${REPO}" ]]; then
            echo "::error::Faltan los secrets AZURE_DEVOPS_PAT o AZURE_DEVOPS_REPO"
            exit 1
          fi
          git remote add azure "https://sync:${PAT}@${REPO}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            git push --force azure "${GITHUB_REF}"
          else
            git push --force azure "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
