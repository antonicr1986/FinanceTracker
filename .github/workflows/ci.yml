name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  # Permite lanzar el pipeline a mano desde la pestana Actions
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Busca credenciales en TODO el historial, no solo en el ultimo commit.
  # No depende del build: si hay una fuga, da igual que compile.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks necesita el historial completo

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      # --redact es importante: sin el, el secreto encontrado acabaria escrito
      # en los logs de la ejecucion, que en un repo publico ve cualquiera
      - name: Scan for secrets
        run: gitleaks git . --config .gitleaks.toml --redact --verbose

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FinanceTracker.sln

      # Lint: falla si algun fichero no sigue el formato del .editorconfig
      # (espacios, sangria, lineas finales...). No cambia nada, solo comprueba; para
      # arreglarlo en local basta con "dotnet format FinanceTracker.sln".
      - name: Lint
        run: dotnet format FinanceTracker.sln --no-restore --verify-no-changes --verbosity diagnostic

      # Busca paquetes NuGet con vulnerabilidades conocidas (base de datos de
      # avisos de GitHub), tambien entre las dependencias de las dependencias.
      # "dotnet list package" termina bien aunque encuentre alguna, asi que se
      # busca en su salida la frase que lo indica y, si aparece, se falla.
      - name: Vulnerable packages
        run: |
          dotnet list FinanceTracker.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found (see the list above)"
            exit 1
          fi

      - name: Build
        run: dotnet build FinanceTracker.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test FinanceTracker.Tests/FinanceTracker.Tests.csproj --no-restore

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Solo iniciamos sesion cuando vamos a publicar (los PR solo validan el build)
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Genera los tags automaticamente y normaliza el nombre a minusculas
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Primero se construye la imagen solo en local (load: true), sin publicarla,
      # para poder escanearla antes de que llegue al registro
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: financetracker-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy se instala desde el repositorio oficial de Aqua Security
      # (paquete firmado), igual que se hace en un servidor
      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq trivy

      # Escanea la imagen entera: no solo los paquetes NuGet (eso ya lo hace
      # "Vulnerable packages"), sino tambien las librerias del sistema operativo
      # base. Falla si hay alguna vulnerabilidad ALTA o CRITICA que ya tenga
      # parche; las que aun no lo tienen se muestran pero no bloquean, porque
      # no hay nada que actualizar y un pipeline siempre en rojo deja de leerse.
      - name: Scan image with Trivy
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            financetracker-api:scan

      # Solo se publica si el escaneo ha pasado. La segunda construccion sale
      # de la cache, asi que es practicamente instantanea.
      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # Despliegue a Azure App Service. Solo en push a master y solo si los tests
  # pasan: un push roto no llega a produccion.
  deploy:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish FinanceTracker.Api/FinanceTracker.Api.csproj -c Release -o publish

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: financetracker-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
