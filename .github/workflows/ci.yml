name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FinanceTracker.Api/FinanceTracker.Api.csproj

      - name: Build
        run: dotnet build FinanceTracker.Api/FinanceTracker.Api.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test FinanceTracker.Tests/FinanceTracker.Tests.csproj --no-restore

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t financetracker:${{ github.sha }} .