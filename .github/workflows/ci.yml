name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  # Permite lanzar el pipeline a mano desde la pestana Actions
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Permisos minimos por defecto para el GITHUB_TOKEN en todos los jobs: solo
# lectura del codigo. Los jobs que necesitan mas (docker, terraform-plan) lo
# declaran ellos mismos y solo para ellos.
permissions:
  contents: read

jobs:
  # Comprueba la infraestructura como codigo sin tocar Azure: formato,
  # validacion de la sintaxis y los tipos, y escaneo de seguridad.
  # No necesita credenciales.
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform init
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate

      # Trivy se instala desde el repositorio oficial de Aqua Security
      # (paquete firmado), igual que en el job docker
      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq trivy

      # fmt y validate solo comprueban que el codigo es correcto, no que la
      # infraestructura sea segura. Este escaneo busca malas configuraciones:
      # acceso publico a SQL, HTTPS o TLS no forzados, reglas de red abiertas...
      # Falla con hallazgos ALTOS o CRITICOS. Si alguno es una decision
      # consciente, se documenta y se excluye en terraform/.trivyignore.
      - name: IaC security scan
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            .

  # terraform plan contra Azure en cada PR, para ver ANTES de fusionar que
  # cambiaria en la infraestructura. Solo lectura:
  #  - Entra en Azure por OIDC (sin secretos en GitHub) con una identidad que
  #    solo puede leer el grupo de recursos y el estado.
  #  - -lock=false porque esa identidad no puede bloquear el estado; nunca
  #    escribe, asi que no hay riesgo.
  #  - El repo es publico y el plan completo imprimiria los app_settings
  #    (cadena de conexion, Jwt__Key). Por eso NO se muestra: solo un resumen
  #    de recurso y accion, en el resumen del job y como comentario en la PR.
  # No corre en PR de forks (no tendrian acceso) ni en las de Dependabot.
  terraform-plan:
    needs: terraform
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write       # token OIDC para Azure
      contents: read
      pull-requests: write  # comentario con el resumen
    defaults:
      run:
        working-directory: terraform
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      # La contrasena del administrador SQL es write-only: solo se envia a
      # Azure cuando cambia su version, y un plan nunca envia nada. Basta con
      # un valor aleatorio generado aqui, asi la real no sale de Azure ni hay
      # nada con pinta de contrasena escrito en el repo.
      - name: Valor de relleno para la contrasena SQL
        run: |
          filler=$(openssl rand -hex 24)
          echo "::add-mask::$filler"
          echo "TF_VAR_sql_admin_password=$filler" >> "$GITHUB_ENV"
      - name: terraform init
        run: terraform init -input=false
      - name: terraform plan
        # La salida normal (con los atributos) se descarta; los errores van
        # por stderr y si se ven.
        run: terraform plan -lock=false -input=false -no-color -out=tfplan > /dev/null
      - name: Resumen del plan
        id: summary
        run: |
          changes=$(terraform show -json tfplan | jq -r '
            .resource_changes[]
            | select(.change.actions != ["no-op"] and .change.actions != ["read"])
            | "| `\(.address)` | \(.change.actions | join(" + ")) |"')
          rm -f tfplan
          {
            echo "### Terraform plan"
            echo
            if [ -z "$changes" ]; then
              echo "Sin cambios: la infraestructura coincide con el codigo."
            else
              echo "| Recurso | Accion |"
              echo "|---|---|"
              echo "$changes"
              if echo "$changes" | grep -q "delete"; then
                echo
                echo "> :warning: **Este plan BORRA o RECREA recursos.** Revisalo con terraform plan en local antes de fusionar."
              fi
            fi
            echo
            echo "_Solo el resumen: el plan completo no se publica porque incluiria secretos._"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comentar en la PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file summary.md --edit-last --create-if-none

  # Busca credenciales en TODO el historial, no solo en el ultimo commit.
  # No depende del build: si hay una fuga, da igual que compile.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks necesita el historial completo

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      # --redact es importante: sin el, el secreto encontrado acabaria escrito
      # en los logs de la ejecucion, que en un repo publico ve cualquiera
      - name: Scan for secrets
        run: gitleaks git . --config .gitleaks.toml --redact --verbose

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FinanceTracker.sln

      # Lint: falla si algun fichero no sigue el formato del .editorconfig
      # (espacios, sangria, lineas finales...). No cambia nada, solo comprueba; para
      # arreglarlo en local basta con "dotnet format FinanceTracker.sln".
      - name: Lint
        run: dotnet format FinanceTracker.sln --no-restore --verify-no-changes --verbosity diagnostic

      # Busca paquetes NuGet con vulnerabilidades conocidas (base de datos de
      # avisos de GitHub), tambien entre las dependencias de las dependencias.
      # "dotnet list package" termina bien aunque encuentre alguna, asi que se
      # busca en su salida la frase que lo indica y, si aparece, se falla.
      - name: Vulnerable packages
        run: |
          dotnet list FinanceTracker.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found (see the list above)"
            exit 1
          fi

      - name: Build
        run: dotnet build FinanceTracker.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test FinanceTracker.Tests/FinanceTracker.Tests.csproj --no-restore

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Solo iniciamos sesion cuando vamos a publicar (los PR solo validan el build)
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Genera los tags automaticamente y normaliza el nombre a minusculas
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Primero se construye la imagen solo en local (load: true), sin publicarla,
      # para poder escanearla antes de que llegue al registro
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: financetracker-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy se instala desde el repositorio oficial de Aqua Security
      # (paquete firmado), igual que se hace en un servidor
      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq trivy

      # Escanea la imagen entera: no solo los paquetes NuGet (eso ya lo hace
      # "Vulnerable packages"), sino tambien las librerias del sistema operativo
      # base. Falla si hay alguna vulnerabilidad ALTA o CRITICA que ya tenga
      # parche; las que aun no lo tienen se muestran pero no bloquean, porque
      # no hay nada que actualizar y un pipeline siempre en rojo deja de leerse.
      - name: Scan image with Trivy
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            financetracker-api:scan

      # Solo se publica si el escaneo ha pasado. La segunda construccion sale
      # de la cache, asi que es practicamente instantanea.
      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # Despliegue a Azure App Service. Solo en push a master y solo si TODOS los
  # controles han pasado: tests, escaneo de la imagen (docker), escaneo de
  # secretos (secrets), validacion y escaneo de seguridad de la
  # infraestructura (terraform) y DAST activo de la API (dast-api). Si
  # cualquiera falla, no se despliega.
  deploy:
    needs: [build-and-test, docker, secrets, terraform, dast-api]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Incluye hasta ~15 min de reintentos del smoke test
    timeout-minutes: 25
    # Un solo despliegue a produccion a la vez. Si llegan dos pushes seguidos,
    # el segundo espera a que termine el primero (no lo cancela: cortar un
    # despliegue a medias podria dejar la app en un estado inconsistente).
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    # La URL desplegada se expone para que el job dast sepa que escanear
    outputs:
      webapp-url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      # Azure ejecuta la MISMA imagen que se acaba de escanear con Trivy y
      # publicar en GHCR, identificada por el SHA del commit: no se vuelve a
      # compilar nada. Para volver a una version anterior basta con desplegar
      # otra vez su etiqueta sha-<commit>.
      - name: Deploy image to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: financetracker-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ghcr.io/antonicr1986/financetracker:sha-${{ github.sha }}

      # Comprobacion tras el despliegue: desplegar no es lo mismo que funcionar.
      # Se llama a /health/ready, que solo responde 200 si la API ha arrancado
      # Y llega a la base de datos. Se reintenta durante unos 5 minutos porque
      # el contenedor tarda en arrancar y Azure SQL serverless puede estar
      # pausado. Si no responde bien a tiempo, el pipeline falla en rojo.
      - name: Smoke test (health check)
        env:
          APP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$APP_URL/health/ready" || true)
            echo "Intento $i: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "La API responde y llega a la base de datos."
              exit 0
            fi
            sleep 10
          done
          echo "::error::La API no responde correctamente en $APP_URL/health/ready"
          exit 1

  # DAST pasivo de produccion: revisa la API ya desplegada desde fuera,
  # con OWASP ZAP en modo baseline (no destructivo): cabeceras de
  # seguridad que faltan, cookies inseguras, informacion expuesta en errores...
  # Va despues del smoke test, asi que la API ya esta arrancada.
  #  - fail_action: true: cualquier alerta nueva pone el pipeline en rojo. Los
  #    riesgos aceptados estan en .zap/rules.tsv como INFO (salen en el
  #    informe pero no fallan), cada uno con su motivo.
  #  - allow_issue_writing: false porque el repo es publico: el informe NO se
  #    publica como issue (seria una lista de debilidades a la vista de todos),
  #    solo como artefacto de la ejecucion. Asi ademas basta con permiso de
  #    solo lectura.
  dast:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ needs.deploy.outputs.webapp-url }}
          # Las reglas se pasan con -c a mano: la action solo usa rules_file_name
          # si el archivo tiene alguna regla IGNORE, y aqui todas son INFO.
          cmd_options: '-c .zap/rules.tsv'
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-report

  # DAST activo y autenticado de la API: ZAP lee el swagger.json y ataca TODOS
  # los endpoints (inyecciones, cabeceras, errores que revelan informacion...).
  # Como son ataques reales, NO se hace contra produccion: se levanta la API y
  # un SQL Server desechables en el propio runner (docker compose), con
  # secretos aleatorios que solo existen durante esta ejecucion.
  #  - Se autentica con la cuenta demo, que la API siembra al arrancar, para
  #    llegar tambien a los endpoints que exigen JWT.
  #  - fail_action: true y deploy depende de este job: si ZAP encuentra algo
  #    nuevo, no se despliega. Riesgos aceptados en .zap/rules.tsv (INFO).
  #  - El informe queda como artefacto (zap-api-report), no como issue,
  #    porque el repo es publico.
  dast-api:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Arrancar la API y SQL Server desechables
        run: |
          jwt_key=$(openssl rand -hex 32)
          sa_secret="Aa1-$(openssl rand -hex 16)"
          echo "::add-mask::$jwt_key"
          echo "::add-mask::$sa_secret"
          JWT_KEY="$jwt_key" MSSQL_SA_PASSWORD="$sa_secret" docker compose up -d --build

      - name: Esperar a que la API este lista
        run: |
          for i in $(seq 1 40); do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://localhost:8080/health/ready || true)
            echo "Intento $i: HTTP $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::La API desechable no ha arrancado"
          docker compose logs api | tail -100
          exit 1

      - name: Iniciar sesion con la cuenta demo
        run: |
          token=$(curl -s -X POST http://localhost:8080/api/Users/login \
            -H "Content-Type: application/json" \
            -d '{"email":"demo@financetracker.app","password":"Demo1234!"}' | jq -r .token) # gitleaks:allow
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::No se pudo iniciar sesion con la cuenta demo"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "ZAP_AUTH_HEADER_VALUE=Bearer $token" >> "$GITHUB_ENV"

      - name: OWASP ZAP API scan
        uses: zaproxy/action-api-scan@v0.10.0
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_SITE: localhost
        with:
          target: http://localhost:8080/swagger/v1/swagger.json
          format: openapi
          # Las reglas se pasan con -c a mano: la action solo usa rules_file_name
          # si el archivo tiene alguna regla IGNORE, y aqui todas son INFO.
          cmd_options: '-c .zap/rules.tsv'
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-api-report

      - name: Apagar el entorno
        if: always()
        run: docker compose down -v
