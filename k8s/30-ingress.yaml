# Ingress: la puerta de entrada del trafico HTTP al cluster.
#
# Requiere un Ingress controller instalado (aqui, Traefik con Helm; ver
# k8s/README.md). Esta regla dice: todo lo que llegue con el dominio
# financetracker.localhost va al Service "api", que reparte entre las
# replicas que esten listas.
#
# *.localhost resuelve siempre a tu propio PC, sin tocar el fichero hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: financetracker
  namespace: financetracker
spec:
  ingressClassName: traefik
  rules:
    - host: financetracker.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
