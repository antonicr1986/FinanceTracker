# Valores por defecto del chart. Cualquiera se puede cambiar al instalar:
#   helm install financetracker ./charts/financetracker --set api.replicas=3
# o con un fichero propio:  -f mis-valores.yaml

api:
  image:
    repository: ghcr.io/antonicr1986/financetracker
    # Etiqueta de la imagen: la del commit que esta en produccion (sha-...),
    # nunca "latest". La actualiza el CI (job chart-image-tag) tras cada
    # despliegue correcto, asi Git dice siempre que version desplegar.
    tag: sha-97e880dd9dd2cd04f142cd3c20a54372b3ec70b3
    pullPolicy: IfNotPresent
  # Replicas fijas. Si autoscaling.enabled es true, las decide el HPA entre
  # minReplicas y maxReplicas y este valor no se usa.
  replicas: 2
  # Escalado automatico por CPU (HorizontalPodAutoscaler). Necesita
  # metrics-server en el cluster; sin el, el HPA no tiene datos y se queda en
  # minReplicas.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  # PodDisruptionBudget: en un mantenimiento del cluster (vaciar un nodo,
  # actualizar...) siempre queda al menos esta cantidad de API funcionando.
  minAvailable: 1
  environment: Production
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

sql:
  # false = usar una base de datos externa (p. ej. Azure SQL): no se despliega
  # SQL Server en el cluster y la cadena de conexion apunta fuera.
  enabled: true
  image: mcr.microsoft.com/mssql/server:2022-latest
  storage: 5Gi
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 3Gi

# Imagen minima del initContainer que espera a SQL antes de arrancar la API.
waitImage: busybox:1.37

# Los secretos NO van en este fichero ni en Git. El chart solo usa Secrets que
# ya existen en el namespace (creados con kubectl, o en una empresa por
# External Secrets / Key Vault). Aqui solo se dicen sus nombres.
secrets:
  sql: sql-secret        # clave: MSSQL_SA_PASSWORD
  api: api-secret        # claves: ConnectionStrings__DefaultConnection, Jwt__Key, Mfa__EncryptionKey

ingress:
  enabled: true
  className: traefik
  host: financetracker.localhost
