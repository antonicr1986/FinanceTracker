apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  labels:
    {{- include "financetracker.labels" . | nindent 4 }}
data:
  ASPNETCORE_ENVIRONMENT: {{ .Values.api.environment | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "financetracker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        # Si cambia el ConfigMap, cambia este hash y los pods se recrean solos.
        checksum/config: {{ .Values.api.environment | sha256sum }}
    spec:
      # Todo el pod como usuario sin privilegios: "app" (UID 1654), el que trae
      # la imagen de ASP.NET. Ni root ni escalar privilegios, y el perfil
      # seccomp por defecto del runtime (limita las llamadas al sistema).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.sql.enabled }}
      # initContainer: corre ANTES que la API y solo termina cuando SQL esta
      # listo. Truco: el Service "sql" es headless, y su nombre DNS solo
      # resuelve cuando el pod de SQL ha pasado su readinessProbe. Asi la API
      # no arranca (ni intenta migrar) contra una base de datos que no responde.
      initContainers:
        - name: esperar-sql
          image: {{ .Values.waitImage }}
          command:
            - sh
            - -c
            - |
              echo "Esperando a que SQL Server este listo..."
              until nslookup sql.{{ .Release.Namespace }}.svc.cluster.local > /dev/null 2>&1; do sleep 2; done
              echo "SQL Server listo."
          securityContext:
            {{- include "financetracker.containerSecurityContext" . | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8080
          securityContext:
            {{- include "financetracker.containerSecurityContext" . | nindent 12 }}
          # El disco del contenedor es de solo lectura: .NET solo escribe en
          # /tmp y en las claves de ASP.NET (DataProtection, en el HOME de
          # "app"). Las dos son temporales: se pierden al recrear el pod, igual
          # que ya pasaba antes dentro del contenedor.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: aspnet-keys
              mountPath: /home/app/.aspnet
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.api }}
                  key: ConnectionStrings__DefaultConnection
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.api }}
                  key: Jwt__Key
            - name: Mfa__EncryptionKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.api }}
                  key: Mfa__EncryptionKey
      volumes:
        - name: tmp
          emptyDir: {}
        - name: aspnet-keys
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "financetracker.labels" . | nindent 4 }}
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
